[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grudge-lab"
version = "0.2.0"
description = "Evidence-backed conversation memory and prompt block workbench"
requires-python = ">=3.11"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "COMMERCIAL.md", "THIRD_PARTY_NOTICES.md", "licenses/legacy/*"]
dependencies = ["mcp>=2,<3"]

[project.scripts]
grudge-lab = "grudge_lab.cli:main"

[tool.setuptools.package-data]
grudge_lab = ["static/*"]

[tool.setuptools.packages.find]
include = ["grudge_lab*"]
